name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (cppcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: make lint

  build-unix:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            cc: gcc
          - name: linux-clang
            cc: clang

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            clang \
            libgtk2.0-dev \
            libcurl4-openssl-dev \
            libcairo2-dev

      - name: Build
        env:
          CC: ${{ matrix.cc }}
          CFLAGS: -O2 -Werror
        run: |
          make clean
          make

      - name: Test
        env:
          CC: ${{ matrix.cc }}
          CFLAGS: -O2 -Werror
        run: make test

  build-windows:
    name: Build (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gtk2
            mingw-w64-x86_64-curl

      - name: Build
        shell: msys2 {0}
        env:
          CC: gcc
          CFLAGS: -O2 -Werror
        run: |
          make clean
          make

      - name: Test
        shell: msys2 {0}
        env:
          CC: gcc
          CFLAGS: -O2 -Werror
        run: make test

  build-windows-xp:
    name: Build (windows-xp i686)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full pkg-config curl ca-certificates

      - name: Cross-build Windows XP (i686)
        run: |
          set -euo pipefail
          chmod +x packaging/*.sh
          ./packaging/build-win32.sh clean all c-weather-gtk2-tests.exe STATIC=1
          file c-weather-gtk2.exe | tee /dev/stderr | grep -qi 'PE32'
          if file c-weather-gtk2.exe | grep -qiE 'x86-64|PE32\+'; then
            echo "Refusing x86_64 Windows binary" >&2
            exit 1
          fi

      - name: Bundle XP runtime (smoke)
        run: |
          set -euo pipefail
          ./packaging/download-xp-runtime.sh
          ./packaging/windows-xp-bundle-dlls.sh ./c-weather-gtk2.exe dist-xp
          test -f dist-xp/c-weather-gtk2.exe
          test -s dist-xp/curl-ca-bundle.crt
          test -f dist-xp/run-c-weather-gtk2.cmd
